			.dpad-cross {
				position: relative;
				width: 168px;
				height: 168px;
				display: grid;
				grid-template-columns: 56px 56px 56px;
				grid-template-rows: 56px 56px 56px;
				gap: 10px;
				justify-items: center;
				align-items: center;
			}
			.dpad-btn {
				width: 56px;
				height: 56px;
				background: linear-gradient(135deg, #e3f2fd 60%, #b2dfdb 100%);
				border: none;
				border-radius: 14px;
				box-shadow: 0 2px 8px #0001, 0 1.5px 0 #43a047 inset;
				position: relative;
				outline: none;
				cursor: pointer;
				transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
				padding: 0;
				font-size: 1.3rem;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.dpad-btn:hover {
				background: linear-gradient(135deg, #b2dfdb 60%, #e3f2fd 100%);
				box-shadow: 0 4px 16px #43a04733, 0 1.5px 0 #43a047 inset;
			}
			.dpad-btn:active,
			.dpad-btn:focus {
				background: #43a047;
				color: #fff;
				box-shadow: 0 1px 2px #8884;
				transform: scale(0.95);
			}
			.dpad-center {
				grid-column: 2;
				grid-row: 2;
				border-radius: 50%;
				background: linear-gradient(135deg, #bcaaa4 60%, #fff 100%);
				border: 2.5px solid #43a047;
				box-shadow: 0 1px 4px #8882 inset;
			}
			.dpad-up    { grid-column: 2; grid-row: 1; }
			.dpad-down  { grid-column: 2; grid-row: 3; }
			.dpad-left  { grid-column: 1; grid-row: 2; }
			.dpad-right { grid-column: 3; grid-row: 2; }

			.dpad-up::before,
			.dpad-down::before,
			.dpad-left::before,
			.dpad-right::before {
				content: '';
				display: block;
				width: 0; height: 0;
				margin: auto;
				border-style: solid;
				position: absolute;
				top: 50%; left: 50%;
				transform: translate(-50%, -50%);
			}

			.dpad-up::before {
				border-width: 0 9px 15px 9px;
				border-color: transparent transparent #ffb66b transparent;
			}
			.dpad-down::before {
				border-width: 15px 9px 0 9px;
				border-color: #ffb66b transparent transparent transparent;
			}
			.dpad-left::before {
				border-width: 9px 15px 9px 0;
				border-color: transparent #ffb66b transparent transparent;
			}
			.dpad-right::before {
				border-width: 9px 0 9px 15px;
				border-color: transparent transparent transparent #ffb66b;
			}
