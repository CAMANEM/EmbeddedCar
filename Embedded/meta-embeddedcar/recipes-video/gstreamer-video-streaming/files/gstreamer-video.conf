# GStreamer Video Streaming Configuration
# This file is sourced by the gstreamer-video-streaming service

# Video Device Configuration
VIDEO_DEVICE="/dev/video0"

# Video Resolution
VIDEO_WIDTH="640"
VIDEO_HEIGHT="480"

# Frame Rate (frames per second)
VIDEO_FRAMERATE="30"

# Network Configuration
VIDEO_HOST="0.0.0.0"
VIDEO_PORT="8080"

# Video Quality (1-100, higher = better quality)
VIDEO_QUALITY="85"

# Logging
LOG_LEVEL="INFO"

# Auto-start service on boot (true/false)
AUTO_START="true"

# Additional GStreamer options
GSTREAMER_DEBUG="2"
GSTREAMER_EXTRA_OPTS=""