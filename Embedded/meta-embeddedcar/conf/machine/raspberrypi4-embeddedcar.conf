#@TYPE: Machine
#@NAME: RaspberryPi 4 Model B (EmbeddedCar)
#@DESCRIPTION: Machine configuration for RaspberryPi 4 Model B with PWM support for EmbeddedCar project

# Base on standard RPi4 configuration
require conf/machine/raspberrypi4.conf

# Override machine name for clarity
MACHINEOVERRIDES =. "raspberrypi4:"

# Enable PWM hardware support in config.txt
RPI_EXTRA_CONFIG:append = " \n\
# PWM Hardware Support for EmbeddedCar \n\
dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4 \n\
dtparam=pwm=on \n\
dtoverlay=pwm \n\
"

# Ensure PWM kernel module loads
KERNEL_MODULE_AUTOLOAD += "pwm-bcm2835"

# Add PWM machine feature
MACHINE_FEATURES:append = " pwm"